services:
  db:
    image: postgres:17
    container_name: backlog-db
    environment:
      POSTGRES_USER: backlog
      # Şifre git'e girmeyen .env dosyasından okunur (.env.example'a bakın).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}
      POSTGRES_DB: backlog_killer
    ports:
      - "5432:5432"
    volumes:
      - backlog-data:/var/lib/postgresql/data

volumes:
  backlog-data:
